<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#111827;color:#e5e7eb;display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .login-box{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:40px;width:100%;max-width:380px;}
    .login-box h2{text-align:center;margin-bottom:8px;font-size:1.3rem;}
    .login-box p{text-align:center;color:#9ca3af;font-size:0.85rem;margin-bottom:28px;}
    .form-group{margin-bottom:20px;}
    .form-group label{display:block;margin-bottom:6px;color:#9ca3af;font-size:0.8rem;}
    .form-group input{width:100%;padding:12px;background:#374151;border:1px solid #4b5563;border-radius:8px;color:#e5e7eb;font-size:0.9rem;font-family:inherit;}
    .form-group input:focus{outline:none;border-color:#a78bfa;}
    .btn{width:100%;padding:12px;background:#a78bfa;color:#fff;border:none;border-radius:8px;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:inherit;}
    .btn:hover{background:#8b5cf6;}
    .error{color:#ef4444;font-size:0.8rem;text-align:center;margin-top:12px;display:none;}
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Panel</h2>
    <p>Enter your password to continue</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required autofocus>
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="error" id="error">Wrong password</div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          window.location.href = '/admin/dashboard';
        } else {
          errorEl.style.display = 'block';
          errorEl.textContent = data.message || 'Wrong password';
        }
      } catch(err) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'Connection error';
      }
    });
  </script>
</body>
</html>
