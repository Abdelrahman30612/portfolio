<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page{
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;padding:24px;
    }
    .error-code{
      font-size:8rem;font-weight:800;color:var(--accent);
      line-height:1;margin-bottom:20px;
      text-shadow:0 0 40px rgba(180,99,240,0.3);
    }
    .error-title{
      font-size:1.5rem;margin-bottom:10px;
    }
    .error-desc{
      color:var(--text-dim);margin-bottom:30px;max-width:400px;
    }
    .error-page .btn{
      margin-top:10px;
    }
    .error-icon{
      font-size:4rem;color:var(--accent);margin-bottom:30px;
      animation:float 3s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-15px);}
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-icon"><i class="fas fa-ghost"></i></div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">Oops! The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="btn">← Back to Home</a>
  </div>
</body>
</html>
